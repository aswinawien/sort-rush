org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental caches cannot be closed when the build directory lives
# on the Windows/WSL shared tree: Gradle fails with "Could not close
# incremental caches in ...\build\<plugin>\kotlin\...\caches-jvm". Seen on
# 2026-08-24 against shared_preferences_android and audioplayers_android in
# both profile and release. Disabling incremental Kotlin compilation avoids
# creating those caches at all. Costs rebuild time; changes no output.
kotlin.incremental=false

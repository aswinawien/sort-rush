name: sort_rush
description: "A one-thumb parcel-sorting game with a glitchy counterculture identity."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  # Flame 1.36.0 raised its floor to Flutter 3.41.0.
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # SFX are synthesised at runtime. Music is Gemini/Lyria OGG loops dropped
  # under assets/audio/. Shapes, type, and particles stay procedural.
  assets:
    - assets/audio/
